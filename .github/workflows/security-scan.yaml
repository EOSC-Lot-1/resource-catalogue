name: Security Scan (Trivy)

on:
  push:
    branches:
    - trivy
    - security-scan
    tags:
    - 'v5.*'
  workflow_dispatch:

permissions:
  contents: read
  #security-events: write # required for uploading SARIF results to GitHub Code Scanning

jobs:

  generate-sbom:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: >-
        Build with Maven (and generate dependency tree for Trivy SCA)
      run: >-
        mvn -B -P ${MAVEN_PROFILE} dependency:tree -DoutputFile=maven_dep_tree.txt &&
        mvn -B -P ${MAVEN_PROFILE} package
      env:
        MAVEN_PROFILE: lot1
        GITHUB_TOKEN: '${{ secrets.PACKAGE_READER_ACCESS_TOKEN }}'

    - name: >-
        Run Trivy vulnerability scanner for filesystem (dependencies and secrets)
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: fs # scan the filesystem
        scan-ref: '.' # scan the current directory
        format: cyclonedx # output format
        output: sbom.json #
        severity: CRITICAL,HIGH
        scanners: vuln,misconfig,secret
        ignore-unfixed: true # ignore vulnerabilities without a fix
        github-pat: ${{ secrets.GITHUB_TOKEN }}
        skip-dirs: docs,config-example
        skip-files: mvnw,mvnw.cmd
        #exit-code: '1' # fail the build if vulnerabilities are found
    - run: >-
        stat sbom.json

    - name: >-
        Upload SBOM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json

    - run: >-
        jq --version

    - name: >-
        Upload SBOM to Dependency Tracker
      env:
        DEPENDENCY_TRACK_API_URL: >-
          https://sms.eoscnode.org/api
        DEPENDENCY_TRACK_API_KEY: '${{ secrets.DEPENDENCY_TRACK_API_KEY }}'
        DEPENDENCY_TRACK_PROJECT_ID: '${{ vars.DEPENDENCY_TRACK_PROJECT_ID }}'
      run: >-
        .bin/upload-sbom.sh

    - name: >-
        Upload SBOM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-versioned
        path: sbom.json

  semgrep:
    runs-on: ubuntu-22.04
    container:
      image: semgrep/semgrep:1.131.0
    steps:
      - uses: actions/checkout@v4
      - name: >-
          Run Semgrep
        run: >-
          semgrep scan --config=auto
          --json --output semgrep-results.json
          --exclude=.github --exclude=docs
      - run: >-
          jq . semgrep-results.json

